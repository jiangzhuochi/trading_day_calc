[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-day-calc"
version = "1.0.0"
description = "轻量、可靠的中国 A 股交易日历"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "jiangzhuochi", email = "1053067021@qq.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_day_calc = ["*.json", "py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/trading_day_calc/__init__.py" = ["F403"]
"tests/*.py" = ["F403", "F405"]

[tool.pyright]
include = ["src", "tests", "script"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmark",
    "network: test that accesses the live exchange websites",
]
